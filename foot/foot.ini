# -*- conf -*-

# shell=$SHELL (if set, otherwise user's default shell from /etc/passwd)
# term=foot (or xterm-256color if built with -Dterminfo=disabled)
# login-shell=no

# app-id=foot
# title=foot
# locked-title=no

font=GoogleSansCode:size=11

# font-bold=<bold variant of regular font>
# font-italic=<italic variant of regular font>
# font-bold-italic=<bold+italic variant of regular font>
# line-height=<font metrics>
# letter-spacing=0
# horizontal-letter-offset=0
# vertical-letter-offset=0
# underline-offset=<font metrics>
# box-drawings-uses-font-glyphs=no
# dpi-aware=auto

# initial-window-size-pixels=700x500  # Or,
# initial-window-size-chars=<COLSxROWS>
# initial-window-mode=windowed
pad=12x12                             # optionally append 'center'
resize-by-cells=no
resize-keep-grid=no
# resize-delay-ms=100

# notify=notify-send -a ${app-id} -i ${app-id} ${title} ${body}

# bold-text-in-bright=no
# word-delimiters=,│`|:"'()[]{}<>
# selection-target=primary
# workers=<number of logical CPUs>

[environment]
shell=/bin/zsh
# name=value

[bell]
# urgent=no
# notify=no
# command=
# command-focused=no

[scrollback]
# lines=1000
# multiplier=3.0
# indicator-position=relative
# indicator-format=

[url]
# launch=xdg-open ${url}
# label-letters=sadfjklewcmpgh
# osc8-underline=url-mode
# protocols=http, https, ftp, ftps, file, gemini, gopher
# uri-characters=abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-_.,~:;/?#@!$&%*+="'()[]

[cursor]
# style=block
# blink=no
# beam-thickness=1.5
# underline-thickness=<font underline thickness>

[mouse]
# hide-when-typing=no
# alternate-scroll-mode=yes

[colors-dark]
alpha=1
foreground=e6edf3
background=0d1117

## Normal/regular colors (color palette 0-7)
regular0=08090a
regular1=f54d46
regular2=49c552
#regular3=cd8940
regular3=d0a820
regular4=70b7ff
regular5=b392f0
regular6=76e3ea
regular7=e6edf3

##regular0=0b1115   # black (almost background)
##regular1=ff7b72   # red (errors / red accents)
##regular2=7ee787   # green (success / diffs)
##regular3=d0a820   # yellow (warnings)
##regular4=539bf5   # blue (links / identifiers)
##regular5=b392f0   # magenta (purple accents)
##regular6#56d0d6   # cyan (types / info)
##regular7=e6edf3   # white (foreground variants)

## Bright colors (color palette 8-15)
bright0=6e7781
bright1=ff7670
bright2=8bdb9b
#bright3=dfae86
bright3=f0f880
bright4=a2d2fb
bright5=d1b9ff
bright6=b3f0ff
bright7=ffffff

##bright0=6e7781    # bright black / comments
##bright1=ff7b72    # bright red / keywords
##bright2=8bdb9b    # bright green
##bright3=f0f880    # bright yellow / constants
##bright4=79b8ff    # bright blue / strings
##bright5=d1b9ff    # bright magenta
##bright6#9be7ea    # bright cyan
##bright7=ffffff    # bright white

## dimmed colors (see foot.ini(5) man page)
# dim0=<not set>
# ...
# dim7=<not-set>

## The remaining 256-color palette
# 16 = <256-color palette #16>
# ...
# 255 = <256-color palette #255>

## Misc colors
# selection-foreground=<inverse foreground/background>
# selection-background=<inverse foreground/background>
# jump-labels=<regular0> <regular3>          # black-on-yellow
# scrollback-indicator=<regular0> <bright4>  # black-on-bright-blue
# search-box-no-match=<regular0> <regular1>  # black-on-red
# search-box-match=<regular0> <regular3>     # black-on-yellow
# urls=<regular3>

[csd]
# preferred=server
size=0
# font=<primary font>
# color=<foreground color>
# hide-when-typing=no
# border-width=0
# border-color=<csd.color>
# button-width=26
# button-color=<background color>
# button-minimize-color=<regular4>
# button-maximize-color=<regular2>
# button-close-color=<regular1>

